# Local-only configuration. project_id is NOT the hosted project reference.
# Do not run config push, link or remote commands before review.
project_id = "AmigoSecreto2026"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
# Confirm hosted major version manually before a future link/migration review.
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = false

[storage]
enabled = true
file_size_limit = "3MiB"

[storage.s3_protocol]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = false
site_url = "http://localhost:5173"
enable_signup = false
enable_anonymous_sign_ins = false

[analytics]
enabled = false

[edge_runtime]
enabled = true

# wishlist-api handles T07 access and T08 mutations, validating capabilities in SQL.
# Each enabled endpoint validates capabilities or signed one-use server transport claims.
[functions.wishlist-api]
enabled = true
verify_jwt = false
entrypoint = "./functions/wishlist-api/index.ts"

[functions.product-metadata]
enabled = true
verify_jwt = false
entrypoint = "./functions/product-metadata/index.ts"

[functions.media-upload]
enabled = true
verify_jwt = false
entrypoint = "./functions/media-upload/index.ts"
static_files = ["./functions/media-upload/vendor/**/*.wasm"]
